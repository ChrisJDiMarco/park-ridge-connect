name: Deploy Place Catalog Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Docs/place-directory/**"
      - ".github/workflows/deploy-place-catalog-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: park-ridge-connect-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs folder to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build public artifact
        run: |
          mkdir -p _site/place-directory
          cp Docs/place-directory/park-ridge-places.json _site/place-directory/
          cp Docs/place-directory/README.md _site/place-directory/

      - name: Upload place catalog artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
